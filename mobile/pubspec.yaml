name: musicroom_mobile
description: "Music Room — mobile remote control for the Music Room API."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1

  dio: ^5.5.0+1
  socket_io_client: ^2.0.3+1
  connectivity_plus: ^6.0.5

  google_sign_in: ^6.2.1

  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  drift: ^2.20.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  uuid: ^4.5.0

  flutter_beacon: ^0.5.1

  go_router: ^14.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.20.2

flutter:
  uses-material-design: true
