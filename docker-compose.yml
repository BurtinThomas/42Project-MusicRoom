version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: musicroom
      POSTGRES_PASSWORD: musicroom
      POSTGRES_DB: musicroom
    ports:
      - "5432:5432"
    volumes:
      - musicroom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicroom"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  musicroom_pgdata:
